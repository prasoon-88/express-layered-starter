# Production-like stack: the built image as the API and as the job worker, Redis for the stores,
# and a Redis of its own for the job queue.
#   JWT_SECRET=<32+ characters> docker compose up --build --wait
# For day-to-day work use `pnpm dev`; this is for checking the image and multi-instance behavior.

services:
  app:
    build: .
    ports:
      - '${APP_PORT:-8000}:8000'
    # Set here, not through env_file, so a developer's .env (NODE_ENV=development, ...) never
    # leaks into the container. Any other variable from .env.example can be added below.
    environment:
      NODE_ENV: production
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters) in the shell or in .env}
      REDIS_URL: redis://redis:6379
      AUTH_STORE: redis
      RATE_LIMIT_STORE: redis
      IDEMPOTENCY_STORE: redis
      CACHE_STORE: redis
      QUEUE_REDIS_URL: redis://redis-queue:6379
      # Published straight to the host, no proxy in front, so there is nothing to trust.
      TRUST_PROXY: 'false'
      # Empty by default, which leaves OpenTelemetry off. To send traces to the Jaeger below:
      #   OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 OTEL_METRICS_EXPORTER=none \
      #     docker compose --profile observability up --build --wait
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
    depends_on:
      redis:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    restart: unless-stopped
    # Longer than SHUTDOWN_TIMEOUT_MS (8s by default), so the app finishes its drain before Docker
    # sends SIGKILL. Raise both together.
    stop_grace_period: 15s

  # The same image, running background jobs instead of serving requests (pnpm start:worker).
  # Scale it apart from the API: docker compose up --scale worker=3
  worker:
    build: .
    command: [node, --enable-source-maps, --import, ./dist/instrumentation.js, dist/worker.js]
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters) in the shell or in .env}
      QUEUE_REDIS_URL: redis://redis-queue:6379
      # The image's HEALTHCHECK probes PORT; the worker's health server listens on WORKER_HEALTH_PORT.
      PORT: 8001
      WORKER_HEALTH_PORT: 8001
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
    depends_on:
      redis-queue:
        condition: service_healthy
    restart: unless-stopped
    # Longer than SHUTDOWN_TIMEOUT_MS, which holds WORKER_SHUTDOWN_TIMEOUT_MS for running jobs.
    stop_grace_period: 15s

  redis:
    image: redis:7.4-alpine
    # Append-only file: refresh tokens and revoked sessions survive a Redis restart.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # The job queue: a Redis that never evicts (its default, noeviction, with no maxmemory) and
  # persists every write (AOF), since a job is data. Kept apart from the cache, which evicts.
  redis-queue:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Started only with `--profile observability`. Trace UI on http://localhost:16686, OTLP/HTTP on
  # 4318 (also published, for `pnpm dev` on the host). Jaeger stores traces in memory and takes
  # no metrics, hence OTEL_METRICS_EXPORTER=none above. The app does not depend on it: spans
  # exported before it is up are dropped, never queued against the request.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: [observability]
    ports:
      - '16686:16686'
      - '4318:4318'
    restart: unless-stopped

volumes:
  redis-data:
  redis-queue-data:
