name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, build, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      # The rate limiter's integration tests start a throwaway redis-server on a free port.
      # Without the binary they fail in CI instead of being skipped.
      - name: Install Redis
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Compiling is not enough: boot the built app with src/ gone, the way a production image
      # runs, so a template or asset that only exists in src/ fails here and not in production.
      - name: Smoke test
        env:
          NODE_ENV: production
          PORT: 8000
        run: |
          rm -rf src
          pnpm start &
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-connrefused \
            http://localhost:8000/health/live
          curl --fail --silent --show-error http://localhost:8000/ | grep --quiet "<h1>Home Page</h1>"
