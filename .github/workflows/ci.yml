name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, build, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      # The rate limiter's integration tests start a throwaway redis-server on a free port.
      # Without the binary they fail in CI instead of being skipped.
      - name: Install Redis
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server

      # Fails below the coverage thresholds in package.json, counting files no test loads.
      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      # Compiling is not enough: boot the built app with src/ gone, the way a production image
      # runs, so a template or asset that only exists in src/ fails here and not in production.
      - name: Smoke test
        env:
          NODE_ENV: production
          PORT: 8000
          # Throwaway: production refuses to boot without one, and this run signs no real tokens.
          JWT_SECRET: ci-smoke-test-only-not-a-real-secret-0000
        run: |
          rm -rf src
          pnpm start &
          curl --fail --silent --show-error \
            --retry 20 --retry-delay 1 --retry-connrefused \
            http://localhost:8000/health/live
          curl --fail --silent --show-error http://localhost:8000/ | grep --quiet "<h1>Home Page</h1>"

  docker:
    name: Docker image and Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Throwaway: production refuses to boot without one, and this run signs no real tokens.
      JWT_SECRET: ci-smoke-test-only-not-a-real-secret-0000

    steps:
      - uses: actions/checkout@v5

      # --wait returns once the image's HEALTHCHECK and Redis's report healthy, and fails if either never does.
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Smoke test
        run: |
          set -euo pipefail
          api=http://localhost:8000

          test "$(docker compose exec -T app id -u)" != 0
          curl --fail --silent --show-error "$api/health/ready" | jq --exit-status '.data.status == "ok"'
          curl --fail --silent --show-error "$api/api/docs/openapi.json" \
            | jq --exit-status '.info.title == "express-layered-starter" and .openapi == "3.1.0"'

          # Login and refresh go through the Redis session store.
          user='{"fullName":"Docker Smoke","email":"smoke@example.com","password":"Sm0ke-test-password!"}'
          curl --fail --silent --show-error -H 'Content-Type: application/json' -d "$user" "$api/api/v1/user/register" > /dev/null
          login=$(curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"Sm0ke-test-password!"}' "$api/api/v1/auth/login")
          refresh=$(jq --raw-output '.data.refreshToken' <<< "$login")
          curl --fail --silent --show-error -H 'Content-Type: application/json' \
            -d "{\"refreshToken\":\"$refresh\"}" "$api/api/v1/auth/refresh" > /dev/null
          test "$(docker compose exec -T redis redis-cli keys 'express-layered-starter:auth:rt:*' | wc -l)" -ge 2

          # The worker: not root, ready on its own health port, and running a job the API image enqueues.
          test "$(docker compose exec -T worker id -u)" != 0
          docker compose exec -T worker node -e "fetch('http://127.0.0.1:8001/health/ready').then((r) => process.exit(r.ok ? 0 : 1))"
          docker compose exec -T app node --input-type=module -e "
            const { initJobs } = await import('./dist/lib/queue/index.js');
            const { exampleJob } = await import('./dist/jobs/example.job.js');
            const { ENV_CONSTANTS } = await import('./dist/constants/env/index.js');
            const { jobs, close } = await initJobs(ENV_CONSTANTS, (await import('pino')).default({ level: 'silent' }));
            await jobs.enqueue(exampleJob, { message: 'ci' }, { jobId: 'ci-smoke' });
            await close();"
          for _ in $(seq 1 30); do
            finished=$(docker compose exec -T redis-queue redis-cli hget express-layered-starter:jobs:default:ci-smoke finishedOn | tr -d '\r')
            [ -n "$finished" ] && break
            sleep 1
          done
          test -n "$finished"
          docker compose exec -T worker node dist/jobsAdmin.js failed 2>&1 | grep --quiet '^0 failed job(s)$'

          # A real SIGTERM: the worker drains and exits 0.
          docker compose stop worker
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose ps --all --quiet worker)")" = 0

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down --volumes
